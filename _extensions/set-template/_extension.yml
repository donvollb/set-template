title: set-template
author: Dominik Vollbracht
version: 2.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
        - path: chunk-ausgabe.lua
          at: post-render

      # Seite und Schrift
      papersize: a4
      margin:
        x: 2cm
        top: 3cm
        bottom: 2cm
      mainfont: "Red Hat Text"
      # Schrift wird mitgeliefert (SIL Open Font License, siehe fonts/OFL.txt).
      # Quarto macht "fonts" relativ zum Dokument, Typst sucht aber relativ zum Ordner, in dem
      # quarto aufgerufen wurde. Der zweite Pfad gilt vom Projekt-Hauptordner aus, damit die Schrift
      # auch gefunden wird, wenn ein Dokument in einem Unterordner von dort gerendert wird.
      font-paths:
        - fonts
        - _extensions/set-template/fonts
      fontsize: 10pt
      lang: de

      # Inhaltsverzeichnis auf der ersten Seite
      toc: true
      toc-title: INHALTSVERZEICHNIS
      toc-depth: 1

      # Kopf- und Fußzeile (im Dokument überschreibbar)
      accent_col: "#507289" # Akzentfarbe für Linien, Links, Logo und Hervorhebungen
      header-logo: images/Logo Meze - Cobranding.svg
      lfoot: ""

      # setanalysis gibt fertigen Berichtscode aus, daher "asis" und kein Code im Bericht
      execute:
        echo: false
        output: asis
        warning: false
        message: false
